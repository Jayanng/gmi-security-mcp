rules:
  - id: custom.hardcoded-secret
    languages: [python, javascript, typescript]
    severity: WARNING
    message: >-
      Secret-shaped value assigned directly in code. This is a
      hint, not a verdict: triage must still run, because example
      keys, placeholders, and test values also match the shape.
    pattern-either:
      - patterns:
          - pattern: $VAR = $VALUE
          - metavariable-regex:
              metavariable: $VALUE
              regex: .*(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----).*
          - pattern-not-regex: (?i)(example|placeholder|your[_-]?key|changeme|test|dummy|redacted|sample)
      - patterns:
          - pattern: $VAR = "..."
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i).*(api[_-]?key|secret|password|passwd|token|private[_-]?key).*
          - pattern-not: $VAR = ""
          - pattern-not-regex: (?i)(example|placeholder|your[_-]?key|changeme|test|dummy|redacted|sample|password123)
