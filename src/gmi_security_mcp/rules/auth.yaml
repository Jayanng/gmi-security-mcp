rules:
  - id: custom.missing-auth
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Route registered with no authentication middleware visible
      in the call: no requireAuth, login check, or session check.
      Triage must decide whether this route needs auth; public
      routes such as health checks are false positives.
    patterns:
      - pattern-either:
          - pattern: $APP.get($PATH, $HANDLER)
          - pattern: $APP.post($PATH, $HANDLER)
          - pattern: $APP.put($PATH, $HANDLER)
          - pattern: $APP.delete($PATH, $HANDLER)
          - pattern: $APP.patch($PATH, $HANDLER)
      - pattern-not-regex: (?i)auth
      - pattern-not-regex: (?i)login
      - pattern-not-regex: (?i)session
